<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Track Title — Yeezik · Pre-save</title>
<meta name="description" content="Pre-save the new Yeezik single on your favourite platform.">
<meta name="theme-color" content="#050505">

<!-- Link preview (WhatsApp, Instagram, Telegram, X…) -->
<meta property="og:type" content="music.song">
<meta property="og:title" content="Track Title — Yeezik">
<meta property="og:description" content="Pre-save now. Out soon everywhere.">
<meta property="og:image" content="artwork.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="artwork.png">
<link rel="apple-touch-icon" href="artwork.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --text: #f5f5f5;
    --muted: #8a8a8a;
    --faint: #4a4a4a;
    --line: rgba(255,255,255,0.09);
    --glass: rgba(255,255,255,0.045);
    --glass-hover: rgba(255,255,255,0.085);
    --accent: #FF8C00;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Radio Canada', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(2rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ───── Ambient background: blurred cover + vignette + stars ───── */
  .ambient {
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    background: center / cover no-repeat;
    filter: blur(70px) saturate(1.3);
    opacity: 0.35;
    transform: scale(1.1);
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,255,255,0.06), transparent 70%),
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle ease-in-out infinite;
  }

  .star.spark {
    background: none;
    width: 10px !important;
    height: 10px !important;
  }
  .star.spark::before, .star.spark::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #fff;
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
  }
  .star.spark::after { transform: rotate(45deg) scale(0.6); }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: var(--o, 0.6); transform: scale(1); }
  }

  /* ───── Layout ───── */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ───── Artwork ───── */
  .artwork-wrap {
    width: 100%;
    perspective: 900px;
  }

  .artwork {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: #111;
    border: 1px solid var(--line);
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,0.9),
      0 0 60px -10px rgba(255,255,255,0.08);
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.4s cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }

  .artwork img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* light sweep across the cover */
  .artwork::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.10) 50%, transparent 65%);
    background-size: 250% 100%;
    background-position: 150% 0;
    animation: sheen 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes sheen {
    0%, 60% { background-position: 150% 0; }
    100%    { background-position: -50% 0; }
  }

  /* ───── Meta ───── */
  .meta {
    margin-top: 1.6rem;
    text-align: center;
    width: 100%;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-radius: 999px;
    padding: 5px 12px 5px 10px;
    margin-bottom: 1rem;
  }

  .status .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); }
    100% { box-shadow: 0 0 0 8px transparent; }
  }

  .title {
    font-size: clamp(26px, 7vw, 32px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .artist {
    font-size: 15px;
    color: var(--muted);
    margin-top: 0.35rem;
    letter-spacing: 0.06em;
  }

  /* ───── Countdown ───── */
  .release-info {
    margin-top: 1.6rem;
    width: 100%;
    text-align: center;
  }

  .release-date {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 0.9rem;
  }
  .release-date strong { color: var(--text); font-weight: 500; }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .cd-item {
    padding: 12px 0 10px;
    border-radius: 12px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .cd-value {
    display: block;
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .cd-label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
    margin: 1.6rem 0;
  }

  /* ───── Platform buttons ───── */
  .platforms {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #e8e8e8;
    text-decoration: none;
    font: 500 15px 'Radio Canada', sans-serif;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
    opacity: 0;
    animation: rise 0.6s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .btn:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.18); }
  .btn:active { transform: scale(0.985); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn .icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: var(--brand-bg, #1e1e1e);
  }

  .btn .name { flex: 1; }

  .btn .badge {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    background: #1a1a1a;
    color: #777;
    border: 1px solid #262626;
  }

  .btn .action {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn:hover .action { background: rgba(255,255,255,0.16); }

  /* Spotify = primary call to action */
  .btn.primary {
    background: linear-gradient(135deg, rgba(29,185,84,0.22), rgba(29,185,84,0.06));
    border-color: rgba(29,185,84,0.45);
  }
  .btn.primary:hover { border-color: rgba(29,185,84,0.75); }
  .btn.primary .action { background: #1DB954; color: #000; }
  .btn.primary:hover .action { background: #1ed760; }

  /* ───── Secondary actions ───── */
  .extras {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-top: 14px;
  }

  .ghost {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed rgba(255,255,255,0.14);
    background: transparent;
    color: var(--muted);
    font: 500 13px 'Radio Canada', sans-serif;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); }
  .ghost svg { width: 16px; height: 16px; }

  /* ───── Footer ───── */
  .footer {
    margin-top: 2.2rem;
    text-align: center;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.06em;
    line-height: 1.7;
  }
  .footer a { color: #666; text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: #999; }

  /* ───── Toast ───── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: #f5f5f5;
    color: #000;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .hidden { display: none !important; }

  /* Respect users who prefer less motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .btn { opacity: 1; }
    .star { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>
<div class="vignette"></div>
<div class="stars" id="stars"></div>

<main class="card">

  <div class="artwork-wrap">
    <div class="artwork" id="artwork">
      <img id="cover" src="artwork.png" alt="" width="1000" height="1000">
    </div>
  </div>

  <div class="meta">
    <p class="status"><span class="dot"></span><span id="statusText">Pre-save</span></p>
    <h1 class="title" id="title"></h1>
    <p class="artist" id="artist"></p>
  </div>

  <section class="release-info" id="releaseInfo">
    <p class="release-date" id="releaseLine"></p>
    <div class="countdown" id="countdown" aria-live="off">
      <div class="cd-item"><span class="cd-value" id="d">00</span><span class="cd-label">Days</span></div>
      <div class="cd-item"><span class="cd-value" id="h">00</span><span class="cd-label">Hours</span></div>
      <div class="cd-item"><span class="cd-value" id="m">00</span><span class="cd-label">Min</span></div>
      <div class="cd-item"><span class="cd-value" id="s">00</span><span class="cd-label">Sec</span></div>
    </div>
  </section>

  <div class="divider"></div>

  <nav class="platforms" id="platforms" aria-label="Streaming platforms"></nav>

  <div class="extras">
    <button class="ghost" id="calendarBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Remind me
    </button>
    <button class="ghost" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      Share
    </button>
  </div>

  <footer class="footer">
    &copy; <span id="year"></span> · <span id="footerArtist"></span><br>
    powered by <a href="https://www.dakoyas-lab.com" target="_blank" rel="noopener">dakoyas lab.</a>
  </footer>

</main>

<div class="toast" id="toast" role="status"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ⚙️  CONFIG — change everything here, nothing else to touch
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  title:   'Track Title',
  artist:  'Yeezik',
  cover:   'artwork.png',

  // Release moment with Italian time zone (+01:00 in winter, +02:00 in summer)
  release: '2026-12-05T00:00:00+01:00',

  // Leave a link empty ('') to hide that platform.
  // Before release the link should be your pre-save URL; after release, the track URL.
  links: {
    spotify:      '#',
    apple:        '#',
    soundcloud:   '#',
    beatport:     '#',
    youtubemusic: '#',
    amazon:       '#',
    tidal:        '#',
    deezer:       '#',
  },
};
/* ═══════════════════════════════════════════════════════════════ */

const PLATFORMS = {
  spotify: {
    name: 'Spotify', bg: '#0f2a18', primary: true, pre: 'Pre-save',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.623.623 0 0 1-.277-1.215c3.809-.87 7.076-.496 9.712 1.115a.623.623 0 0 1 .207.857zm1.223-2.722a.78.78 0 0 1-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 0 1-.973-.519.781.781 0 0 1 .52-.973c3.632-1.102 8.147-.568 11.233 1.329a.78.78 0 0 1 .257 1.072zm.105-2.835C14.692 8.95 9.375 8.775 6.297 9.71a.937.937 0 1 1-.543-1.793c3.572-1.082 9.506-.873 13.254 1.482a.937.937 0 0 1-.894 1.638-.94.94 0 0 1-.2-.17z"/></svg>'
  },
  apple: {
    name: 'Apple Music', bg: '#2a0f10', pre: 'Pre-add',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="#FC3C44"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>'
  },
  soundcloud: {
    name: 'SoundCloud', bg: '#2a1500', pre: 'Follow',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M2 15.5q0-1 .7-1.7A2.3 2.3 0 0 1 4.4 13l.4.04A5 5 0 0 1 9.5 9a5 5 0 0 1 4.8 3.6A2.5 2.5 0 0 1 16.5 12a2.5 2.5 0 0 1 2.5 2.5v1A2 2 0 0 1 17 17.5H4a2 2 0 0 1-2-2z" fill="#FF5500"/></svg>'
  },
  beatport: {
    name: 'Beatport', bg: '#0a1f17', pre: 'Pre-order', badge: 'Extended',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="15" r="4" stroke="#01FF95" stroke-width="1.8"/><path d="M13 15V5" stroke="#01FF95" stroke-width="1.8" stroke-linecap="round"/><path d="M13 7a4 4 0 0 1 4 4" stroke="#01FF95" stroke-width="1.8" stroke-linecap="round"/></svg>'
  },
  youtubemusic: {
    name: 'YouTube Music', bg: '#2a0a0a', pre: 'Pre-save',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="#FF0000"><path d="M21.582 7.185a2.506 2.506 0 0 0-1.762-1.762C18.254 5 12 5 12 5s-6.254 0-7.82.423a2.506 2.506 0 0 0-1.762 1.762C2 8.75 2 12 2 12s0 3.25.418 4.815a2.506 2.506 0 0 0 1.762 1.762C5.746 19 12 19 12 19s6.254 0 7.82-.423a2.506 2.506 0 0 0 1.762-1.762C22 15.25 22 12 22 12s0-3.25-.418-4.815zM10 15V9l5.2 3-5.2 3z"/></svg>'
  },
  amazon: {
    name: 'Amazon Music', bg: '#081c26', pre: 'Pre-save',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M3.5 17.5s3.5-1.5 8.5-1.5 8.5 1.5 8.5 1.5" stroke="#00A8E1" stroke-width="1.8" stroke-linecap="round"/><path d="M12 3v11M8 5.5v6M16 5.5v6M5 8v3M19 8v3" stroke="#00A8E1" stroke-width="1.8" stroke-linecap="round"/></svg>'
  },
  tidal: {
    name: 'Tidal', bg: '#1e1e1e', pre: 'Pre-save',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M4 8l4-4 4 4-4 4L4 8z" fill="#aaa"/><path d="M12 8l4-4 4 4-4 4-4-4z" fill="#ddd"/><path d="M8 16l4-4 4 4-4 4-4-4z" fill="#bbb"/></svg>'
  },
  deezer: {
    name: 'Deezer', bg: '#1c0f2a', pre: 'Pre-save',
    icon: '<svg width="23" height="23" viewBox="0 0 24 24" fill="#A238FF"><path d="M18.944 17.369h3.285v1.738h-3.285zm-4.872 0h3.285v1.738h-3.285zm-4.873 0h3.285v1.738H9.199zm-4.872 0H7.61v1.738H4.327zM18.944 14.574h3.285v1.737h-3.285zm-4.872 0h3.285v1.737h-3.285zm-4.873 0h3.285v1.737H9.199zM18.944 11.779h3.285v1.737h-3.285zm-4.872 0h3.285v1.737h-3.285zm-4.873 0h3.285v1.737H9.199zM18.944 8.984h3.285v1.738h-3.285zm-4.872 0h3.285v1.738h-3.285zM18.944 6.189h3.285v1.738h-3.285z"/></svg>'
  },
};

const $ = id => document.getElementById(id);
const releaseAt = new Date(CONFIG.release).getTime();
const isOut = () => Date.now() >= releaseAt;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── Text & cover ── */
document.title = `${CONFIG.title} — ${CONFIG.artist} · ${isOut() ? 'Out now' : 'Pre-save'}`;
$('title').textContent = CONFIG.title;
$('artist').textContent = CONFIG.artist;
$('footerArtist').textContent = CONFIG.artist;
$('year').textContent = new Date().getFullYear();
$('cover').src = CONFIG.cover;
$('cover').alt = `${CONFIG.title} — ${CONFIG.artist} cover`;
$('ambient').style.backgroundImage = `url("${CONFIG.cover}")`;

const dateLabel = new Date(releaseAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Rome' });

/* ── Platform buttons ── */
function renderButtons() {
  const out = isOut();
  const wrap = $('platforms');
  wrap.innerHTML = '';
  let i = 0;
  for (const [key, p] of Object.entries(PLATFORMS)) {
    const url = CONFIG.links[key];
    if (!url) continue;
    const a = document.createElement('a');
    a.className = 'btn' + (p.primary ? ' primary' : '');
    a.href = url;
    if (url !== '#') { a.target = '_blank'; a.rel = 'noopener'; }
    a.style.setProperty('--brand-bg', p.bg);
    a.style.animationDelay = `${0.25 + i++ * 0.06}s`;
    a.innerHTML = `
      <span class="icon-wrap">${p.icon}</span>
      <span class="name">${p.name}</span>
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
      <span class="action">${out ? (key === 'beatport' ? 'Buy' : 'Listen') : p.pre}</span>`;
    wrap.appendChild(a);
  }
}

/* ── Countdown / release state ── */
let wasOut = isOut();
function tick() {
  const out = isOut();
  if (out) {
    $('statusText').textContent = 'Out now';
    $('releaseLine').innerHTML = `Released on <strong>${dateLabel}</strong>`;
    $('countdown').classList.add('hidden');
    $('calendarBtn').classList.add('hidden');
    document.querySelector('.extras').style.gridTemplateColumns = '1fr';
    if (!wasOut) { wasOut = true; renderButtons(); toast('It’s out! 🎉'); }
    return;
  }
  $('releaseLine').innerHTML = `Out on <strong>${dateLabel}</strong>`;
  const dist = releaseAt - Date.now();
  const pad = n => String(n).padStart(2, '0');
  $('d').textContent = pad(Math.floor(dist / 864e5));
  $('h').textContent = pad(Math.floor(dist % 864e5 / 36e5));
  $('m').textContent = pad(Math.floor(dist % 36e5 / 6e4));
  $('s').textContent = pad(Math.floor(dist % 6e4 / 1e3));
}

renderButtons();
tick();
setInterval(tick, 1000);

/* ── Toast ── */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── Add to calendar (.ics) ── */
$('calendarBtn').addEventListener('click', () => {
  const fmt = d => new Date(d).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Yeezik//Presave//EN',
    'BEGIN:VEVENT',
    `UID:${releaseAt}-${CONFIG.artist.replace(/\s/g, '')}@presave`,
    `DTSTAMP:${fmt(Date.now())}`,
    `DTSTART:${fmt(releaseAt)}`,
    `DTEND:${fmt(releaseAt + 36e5)}`,
    `SUMMARY:${CONFIG.artist} — ${CONFIG.title} is out`,
    `DESCRIPTION:Listen now: ${location.href}`,
    `URL:${location.href}`,
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${CONFIG.title} is out!`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = `${CONFIG.artist}-${CONFIG.title}.ics`.replace(/\s+/g, '-');
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ── Share ── */
$('shareBtn').addEventListener('click', async () => {
  const data = { title: `${CONFIG.title} — ${CONFIG.artist}`, text: isOut() ? 'Out now 🔥' : `Out ${dateLabel} — pre-save it 🔥`, url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    toast('Link copied');
  } catch (e) { /* user closed the share sheet */ }
});

/* ── Twinkling stars (echo the cover's star) ── */
(() => {
  const box = $('stars');
  const count = reduceMotion ? 25 : 55;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    const spark = Math.random() < 0.12;
    const size = Math.random() * 2 + 1;
    s.className = 'star' + (spark ? ' spark' : '');
    s.style.cssText = `
      left:${Math.random() * 100}%; top:${Math.random() * 100}%;
      width:${size}px; height:${size}px;
      --o:${spark ? 0.8 : Math.random() * 0.5 + 0.2};
      animation-duration:${Math.random() * 4 + 3}s;
      animation-delay:${Math.random() * 6}s;`;
    box.appendChild(s);
  }
})();

/* ── Subtle 3D tilt on the cover (desktop only) ── */
if (!reduceMotion && matchMedia('(pointer: fine)').matches) {
  const art = $('artwork');
  art.addEventListener('pointermove', e => {
    const r = art.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    art.style.setProperty('--ry', `${x * 10}deg`);
    art.style.setProperty('--rx', `${-y * 10}deg`);
  });
  art.addEventListener('pointerleave', () => {
    art.style.setProperty('--ry', '0deg');
    art.style.setProperty('--rx', '0deg');
  });
}
</script>
</body>
</html>
