<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Track Title — Yeezik · Pre-save</title>
<meta name="description" content="Pre-save the new Yeezik single on your favourite platform.">
<meta name="theme-color" content="#050505">

<!-- Link preview (WhatsApp, Instagram, Telegram, X…) -->
<meta property="og:type" content="music.song">
<meta property="og:title" content="Track Title — Yeezik">
<meta property="og:description" content="Pre-save now. Out soon everywhere.">
<meta property="og:image" content="artwork.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="artwork.png">
<link rel="apple-touch-icon" href="artwork.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Radio+Canada:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --text: #f5f5f5;
    --muted: #8a8a8a;
    --faint: #4a4a4a;
    --line: rgba(255,255,255,0.09);
    --glass: rgba(255,255,255,0.045);
    --glass-hover: rgba(255,255,255,0.085);
    --accent: #FF8C00;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Radio Canada', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(2rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ───── Ambient background: blurred cover + vignette + stars ───── */
  .ambient {
    position: fixed;
    inset: -10%;
    z-index: 0;
    pointer-events: none;
    background: center / cover no-repeat;
    filter: blur(70px) saturate(1.3);
    opacity: 0.35;
    transform: scale(1.1);
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,255,255,0.06), transparent 70%),
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle ease-in-out infinite;
  }

  .star.spark {
    background: none;
    width: 10px !important;
    height: 10px !important;
  }
  .star.spark::before, .star.spark::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #fff;
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
  }
  .star.spark::after { transform: rotate(45deg) scale(0.6); }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50%      { opacity: var(--o, 0.6); transform: scale(1); }
  }

  /* ───── Layout ───── */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ───── Artwork ───── */
  .artwork-wrap {
    width: 100%;
    perspective: 900px;
  }

  .artwork {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    background: #111;
    border: 1px solid var(--line);
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,0.9),
      0 0 60px -10px rgba(255,255,255,0.08);
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--sc, 1));
    transition: transform 0.4s cubic-bezier(.2,.7,.2,1), box-shadow 0.4s;
    will-change: transform;
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }

  .artwork img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* light sweep across the cover */
  .artwork::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.10) 50%, transparent 65%);
    background-size: 250% 100%;
    background-position: 150% 0;
    animation: sheen 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes sheen {
    0%, 60% { background-position: 150% 0; }
    100%    { background-position: -50% 0; }
  }

  /* glare that follows the pointer */
  .glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,0.22), transparent 55%);
    opacity: var(--go, 0);
    transition: opacity 0.3s;
    mix-blend-mode: soft-light;
    z-index: 2;
  }

  .artwork.tilting { box-shadow: 0 45px 90px -25px rgba(0,0,0,0.95), 0 0 80px -10px rgba(255,255,255,0.14); }

  /* ───── Lightbox: cover in primo piano + flip ───── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: background 0.45s, backdrop-filter 0.45s, -webkit-backdrop-filter 0.45s;
    visibility: hidden;
  }
  .lightbox.open {
    visibility: visible;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .lb-stage {
    width: min(88vw, 78vh, 560px);
    aspect-ratio: 1 / 1;
    perspective: 1400px;
    transition: transform 0.55s cubic-bezier(.2,.8,.2,1);
  }

  .lb-tilt {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.35s cubic-bezier(.2,.7,.2,1);
  }

  .lb-flip {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(.3,1.25,.4,1);
    cursor: pointer;
  }
  .lightbox.flipped .lb-flip { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 50px 120px -30px rgba(0,0,0,1), 0 0 100px -20px rgba(255,255,255,0.15);
  }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .face .glare { --go: 1; }

  /* Back cover */
  .face.back {
    transform: rotateY(180deg);
    background:
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.07), transparent 60%),
      #0b0b0b;
    display: flex;
    flex-direction: column;
    padding: 8% 8% 7%;
    color: var(--text);
  }
  .back-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .back-head .b-artist { font-size: clamp(11px, 2.4vw, 13px); letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  .back-head svg { width: clamp(22px, 5vw, 30px); height: auto; opacity: 0.9; }
  .back .b-title { font-size: clamp(22px, 6vw, 36px); font-weight: 700; letter-spacing: -0.02em; margin-top: 4%; line-height: 1.05; }
  .back .tracklist { margin-top: 7%; list-style: none; border-top: 1px solid var(--line); }
  .back .tracklist li {
    display: flex; gap: 12px; align-items: baseline;
    padding: 3.2% 0;
    border-bottom: 1px solid var(--line);
    font-size: clamp(12px, 2.8vw, 15px);
  }
  .back .tracklist .n { color: var(--faint); font-variant-numeric: tabular-nums; width: 1.6em; }
  .back .tracklist .t { flex: 1; }
  .back .tracklist .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  .back .credits {
    margin-top: auto;
    font-size: clamp(9.5px, 2.1vw, 11.5px);
    line-height: 1.75;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .back .credits b { color: #bbb; font-weight: 500; }
  .back-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 5%; gap: 12px; }
  .back-foot .legal { font-size: clamp(8px, 1.8vw, 10px); color: var(--faint); letter-spacing: 0.05em; line-height: 1.5; }
  .barcode { height: clamp(26px, 6vw, 36px); display: flex; gap: 1.5px; align-items: stretch; }
  .barcode i { display: block; background: #d8d8d8; }

  .lb-hint {
    position: absolute;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 0.4s 0.4s;
    pointer-events: none;
    white-space: nowrap;
  }
  .lightbox.open .lb-hint { opacity: 1; }

  .lb-close {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #ddd;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s, background 0.15s;
  }
  .lb-close:hover { background: rgba(255,255,255,0.14); }
  .lightbox.open .lb-close { opacity: 1; }

  /* ───── Meta ───── */
  .meta {
    margin-top: 1.6rem;
    text-align: center;
    width: 100%;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-radius: 999px;
    padding: 5px 12px 5px 10px;
    margin-bottom: 1rem;
  }

  .status .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); }
    100% { box-shadow: 0 0 0 8px transparent; }
  }

  .title {
    font-size: clamp(26px, 7vw, 32px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .artist {
    font-size: 15px;
    color: var(--muted);
    margin-top: 0.35rem;
    letter-spacing: 0.06em;
  }

  /* ───── Countdown ───── */
  .release-info {
    margin-top: 1.6rem;
    width: 100%;
    text-align: center;
  }

  .release-date {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 0.9rem;
  }
  .release-date strong { color: var(--text); font-weight: 500; }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .cd-item {
    padding: 12px 0 10px;
    border-radius: 12px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .cd-value {
    display: block;
    font-size: 28px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .cd-label {
    display: block;
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
    margin: 1.6rem 0;
  }

  /* ───── Platform buttons ───── */
  .platforms {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #e8e8e8;
    text-decoration: none;
    font: 500 15px 'Radio Canada', sans-serif;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.12s;
    opacity: 0;
    animation: rise 0.6s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .btn:hover { background: var(--glass-hover); border-color: rgba(255,255,255,0.18); }
  .btn:active { transform: scale(0.985); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn .icon-wrap {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: var(--brand-bg, #1e1e1e);
  }

  .btn .name { flex: 1; }

  .btn .badge {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    background: #1a1a1a;
    color: #777;
    border: 1px solid #262626;
  }

  .btn .action {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn:hover .action { background: rgba(255,255,255,0.16); }


  /* ───── Secondary actions ───── */
  .extras {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-top: 14px;
  }

  .ghost {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed rgba(255,255,255,0.14);
    background: transparent;
    color: var(--muted);
    font: 500 13px 'Radio Canada', sans-serif;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.03); }
  .ghost svg { width: 16px; height: 16px; }

  /* ───── Footer ───── */
  .footer {
    margin-top: 2.2rem;
    text-align: center;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.06em;
    line-height: 1.7;
  }
  .footer a { color: #666; text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: #999; }

  /* ───── Toast ───── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: #f5f5f5;
    color: #000;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .hidden { display: none !important; }

  /* Respect users who prefer less motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .btn { opacity: 1; }
    .star { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>
<div class="vignette"></div>
<div class="stars" id="stars"></div>

<main class="card">

  <div class="artwork-wrap">
    <div class="artwork" id="artwork" role="button" tabindex="0" aria-label="Open cover">
      <img id="cover" src="artwork.png" alt="" width="1000" height="1000">
      <span class="glare"></span>
    </div>
  </div>

  <div class="meta">
    <p class="status"><span class="dot"></span><span id="statusText">Pre-save</span></p>
    <h1 class="title" id="title"></h1>
    <p class="artist" id="artist"></p>
  </div>

  <section class="release-info" id="releaseInfo">
    <p class="release-date" id="releaseLine"></p>
    <div class="countdown" id="countdown" aria-live="off">
      <div class="cd-item"><span class="cd-value" id="d">00</span><span class="cd-label">Days</span></div>
      <div class="cd-item"><span class="cd-value" id="h">00</span><span class="cd-label">Hours</span></div>
      <div class="cd-item"><span class="cd-value" id="m">00</span><span class="cd-label">Min</span></div>
      <div class="cd-item"><span class="cd-value" id="s">00</span><span class="cd-label">Sec</span></div>
    </div>
  </section>

  <div class="divider"></div>

  <nav class="platforms" id="platforms" aria-label="Streaming platforms"></nav>

  <div class="extras">
    <button class="ghost" id="calendarBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Remind me
    </button>
    <button class="ghost" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      Share
    </button>
  </div>

  <footer class="footer">
    &copy; <span id="year"></span> · <span id="footerArtist"></span><br>
    powered by <a href="https://www.dakoyas-lab.com" target="_blank" rel="noopener">dakoyas lab.</a>
  </footer>

</main>

<div class="toast" id="toast" role="status"></div>

<!-- Cover in primo piano: click per girarla -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="Cover">
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">✕</button>
  <div class="lb-stage" id="lbStage">
    <div class="lb-tilt" id="lbTilt">
      <div class="lb-flip" id="lbFlip">
        <div class="face front">
          <img id="lbCover" src="artwork.png" alt="">
          <span class="glare"></span>
        </div>
        <div class="face back">
          <div class="back-head">
            <span class="b-artist" id="bArtist"></span>
            <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 0L13.4 8.6 20.5 3.5 15.4 10.6 24 12 15.4 13.4 20.5 20.5 13.4 15.4 12 24 10.6 15.4 3.5 20.5 8.6 13.4 0 12 8.6 10.6 3.5 3.5 10.6 8.6Z"/></svg>
          </div>
          <div class="b-title" id="bTitle"></div>
          <ol class="tracklist" id="bTracks"></ol>
          <div class="credits" id="bCredits"></div>
          <div class="back-foot">
            <div class="legal" id="bLegal"></div>
            <div class="barcode" id="bBarcode" aria-hidden="true"></div>
          </div>
          <span class="glare"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="lb-hint" id="lbHint">Tap the cover to flip</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ⚙️  CONFIG — change everything here, nothing else to touch
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {
  title:   'Track Title',
  artist:  'Yeezik',
  cover:   'artwork.png',

  // Release moment with Italian time zone (+01:00 in winter, +02:00 in summer)
  release: '2026-12-05T00:00:00+01:00',

  // Leave a link empty ('') to hide that platform.
  // Before release the link should be your pre-save URL; after release, the track URL.
  links: {
    spotify:      '#',
    apple:        '#',
    soundcloud:   '#',
    beatport:     '#',
    youtubemusic: '#',
    amazon:       '#',
    tidal:        '#',
    deezer:       '#',
  },

  // Retro della copertina (si vede cliccando sull'artwork ingrandito)
  back: {
    tracks: [
      { title: 'Track Title',                  duration: '2:58' },
      { title: 'Track Title (Extended Mix)',   duration: '5:12' },
    ],
    credits: [
      ['Produced by', 'Yeezik'],
      ['Mixed & mastered by', 'Yeezik'],
      ['Artwork', 'Yeezik'],
    ],
    legal: '℗ & © 2026 Yeezik. All rights reserved.',
  },
};
/* ═══════════════════════════════════════════════════════════════ */

const PLATFORMS = {

const $ = id => document.getElementById(id);
const releaseAt = new Date(CONFIG.release).getTime();
const isOut = () => Date.now() >= releaseAt;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── Text & cover ── */
document.title = `${CONFIG.title} — ${CONFIG.artist} · ${isOut() ? 'Out now' : 'Pre-save'}`;
$('title').textContent = CONFIG.title;
$('artist').textContent = CONFIG.artist;
$('footerArtist').textContent = CONFIG.artist;
$('year').textContent = new Date().getFullYear();
$('cover').src = CONFIG.cover;
$('cover').alt = `${CONFIG.title} — ${CONFIG.artist} cover`;
$('ambient').style.backgroundImage = `url("${CONFIG.cover}")`;

const dateLabel = new Date(releaseAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Rome' });

/* ── Platform buttons ── */
function renderButtons() {
  const out = isOut();
  const wrap = $('platforms');
  wrap.innerHTML = '';
  let i = 0;
  for (const [key, p] of Object.entries(PLATFORMS)) {
    const url = CONFIG.links[key];
    if (!url) continue;
    const a = document.createElement('a');
    a.className = 'btn' + (p.primary ? ' primary' : '');
    a.href = url;
    if (url !== '#') { a.target = '_blank'; a.rel = 'noopener'; }
    a.style.setProperty('--brand-bg', p.bg);
    a.style.animationDelay = `${0.25 + i++ * 0.06}s`;
    a.innerHTML = `
      <span class="icon-wrap">${p.icon}</span>
      <span class="name">${p.name}</span>
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
      <span class="action">${out ? (key === 'beatport' ? 'Buy' : 'Listen') : p.pre}</span>`;
    wrap.appendChild(a);
  }
}

/* ── Countdown / release state ── */
let wasOut = isOut();
function tick() {
  const out = isOut();
  if (out) {
    $('statusText').textContent = 'Out now';
    $('releaseLine').innerHTML = `Released on <strong>${dateLabel}</strong>`;
    $('countdown').classList.add('hidden');
    $('calendarBtn').classList.add('hidden');
    document.querySelector('.extras').style.gridTemplateColumns = '1fr';
    if (!wasOut) { wasOut = true; renderButtons(); toast('It’s out! 🎉'); }
    return;
  }
  $('releaseLine').innerHTML = `Out on <strong>${dateLabel}</strong>`;
  const dist = releaseAt - Date.now();
  const pad = n => String(n).padStart(2, '0');
  $('d').textContent = pad(Math.floor(dist / 864e5));
  $('h').textContent = pad(Math.floor(dist % 864e5 / 36e5));
  $('m').textContent = pad(Math.floor(dist % 36e5 / 6e4));
  $('s').textContent = pad(Math.floor(dist % 6e4 / 1e3));
}

renderButtons();
tick();
setInterval(tick, 1000);

/* ── Toast ── */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── Add to calendar (.ics) ── */
$('calendarBtn').addEventListener('click', () => {
  const fmt = d => new Date(d).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Yeezik//Presave//EN',
    'BEGIN:VEVENT',
    `UID:${releaseAt}-${CONFIG.artist.replace(/\s/g, '')}@presave`,
    `DTSTAMP:${fmt(Date.now())}`,
    `DTSTART:${fmt(releaseAt)}`,
    `DTEND:${fmt(releaseAt + 36e5)}`,
    `SUMMARY:${CONFIG.artist} — ${CONFIG.title} is out`,
    `DESCRIPTION:Listen now: ${location.href}`,
    `URL:${location.href}`,
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${CONFIG.title} is out!`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = `${CONFIG.artist}-${CONFIG.title}.ics`.replace(/\s+/g, '-');
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* ── Share ── */
$('shareBtn').addEventListener('click', async () => {
  const data = { title: `${CONFIG.title} — ${CONFIG.artist}`, text: isOut() ? 'Out now 🔥' : `Out ${dateLabel} — pre-save it 🔥`, url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    toast('Link copied');
  } catch (e) { /* user closed the share sheet */ }
});

/* ── Twinkling stars (echo the cover's star) ── */
(() => {
  const box = $('stars');
  const count = reduceMotion ? 25 : 55;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    const spark = Math.random() < 0.12;
    const size = Math.random() * 2 + 1;
    s.className = 'star' + (spark ? ' spark' : '');
    s.style.cssText = `
      left:${Math.random() * 100}%; top:${Math.random() * 100}%;
      width:${size}px; height:${size}px;
      --o:${spark ? 0.8 : Math.random() * 0.5 + 0.2};
      animation-duration:${Math.random() * 4 + 3}s;
      animation-delay:${Math.random() * 6}s;`;
    box.appendChild(s);
  }
})();

/* ── 3D tilt + glare (shared by the small cover and the big one) ── */
function tilt(el, glareEls, e, max) {
  const r = el.getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  const y = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
  el.style.setProperty('--ry', `${(x - 0.5) * max * 2}deg`);
  el.style.setProperty('--rx', `${(0.5 - y) * max * 2}deg`);
  glareEls.forEach(g => {
    g.style.setProperty('--gx', `${x * 100}%`);
    g.style.setProperty('--gy', `${y * 100}%`);
    g.style.setProperty('--go', '1');
  });
}
function untilt(el, glareEls) {
  el.style.setProperty('--ry', '0deg');
  el.style.setProperty('--rx', '0deg');
  glareEls.forEach(g => g.style.setProperty('--go', '0'));
}

const art = $('artwork');
const artGlare = [art.querySelector('.glare')];

if (!reduceMotion && matchMedia('(pointer: fine)').matches) {
  art.addEventListener('pointerenter', () => { art.classList.add('tilting'); art.style.setProperty('--sc', '1.03'); });
  art.addEventListener('pointermove', e => tilt(art, artGlare, e, 16));
  art.addEventListener('pointerleave', () => {
    art.classList.remove('tilting');
    art.style.setProperty('--sc', '1');
    untilt(art, artGlare);
  });
}

/* ── Back cover content ── */
(() => {
  const b = CONFIG.back || {};
  $('bArtist').textContent = CONFIG.artist;
  $('bTitle').textContent = CONFIG.title;
  $('lbCover').src = CONFIG.cover;
  $('lbCover').alt = `${CONFIG.title} — ${CONFIG.artist} cover`;
  $('bTracks').innerHTML = (b.tracks || []).map((t, i) =>
    `<li><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t"></span><span class="dur"></span></li>`).join('');
  [...$('bTracks').children].forEach((li, i) => {
    li.querySelector('.t').textContent = b.tracks[i].title;
    li.querySelector('.dur').textContent = b.tracks[i].duration || '';
  });
  $('bCredits').innerHTML = '';
  (b.credits || []).forEach(([role, who]) => {
    const line = document.createElement('div');
    line.append(`${role} `);
    const strong = document.createElement('b');
    strong.textContent = who;
    line.append(strong);
    $('bCredits').append(line);
  });
  $('bLegal').innerHTML = '';
  $('bLegal').append(b.legal || '');
  const br = document.createElement('br');
  $('bLegal').append(br, `Release ${dateLabel}`);
  // decorative barcode built from the title so it's always the same
  let seed = [...(CONFIG.title + CONFIG.artist)].reduce((a, c) => a + c.charCodeAt(0), 7);
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  $('bBarcode').innerHTML = Array.from({ length: 34 }, () =>
    `<i style="width:${rnd() < 0.3 ? 3 : 1}px"></i>`).join('');
})();

/* ── Lightbox: cover flies to the front, tap to flip ── */
const lb = $('lightbox'), stage = $('lbStage'), lbTilt = $('lbTilt'), flipper = $('lbFlip');
const lbGlare = [...lb.querySelectorAll('.glare')];
let lbOpen = false, busy = false;

// transform that puts the big stage exactly on top of the small cover
function fromSmall() {
  const a = art.getBoundingClientRect();
  const s = stage.getBoundingClientRect();
  const dx = (a.left + a.width / 2) - (s.left + s.width / 2);
  const dy = (a.top + a.height / 2) - (s.top + s.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${a.width / s.width})`;
}

function openCover() {
  if (lbOpen || busy) return;
  lbOpen = true;
  lb.classList.remove('flipped');
  lb.setAttribute('aria-hidden', 'false');
  untilt(art, artGlare);
  stage.style.transition = 'none';
  lb.style.visibility = 'visible';
  stage.style.transform = fromSmall();
  art.style.visibility = 'hidden';
  stage.getBoundingClientRect(); // force layout before animating
  stage.style.transition = '';
  requestAnimationFrame(() => {
    lb.classList.add('open');
    stage.style.transform = 'none';
  });
  document.body.style.overflow = 'hidden';
  $('lbClose').focus({ preventScroll: true });
}

function closeCover() {
  if (!lbOpen || busy) return;
  busy = true;
  const wasFlipped = lb.classList.contains('flipped');
  lb.classList.remove('flipped');
  untilt(lbTilt, lbGlare);
  const go = () => {
    lb.classList.remove('open');
    stage.style.transform = fromSmall();
    setTimeout(() => {
      art.style.visibility = '';
      lb.style.visibility = '';
      stage.style.transform = '';
      lb.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      lbOpen = busy = false;
      art.focus({ preventScroll: true });
    }, reduceMotion ? 0 : 560);
  };
  // if it's showing the back, turn it to the front first
  wasFlipped && !reduceMotion ? setTimeout(go, 450) : go();
}

art.addEventListener('click', openCover);
art.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCover(); } });

flipper.addEventListener('click', e => {
  e.stopPropagation();
  lb.classList.toggle('flipped');
  $('lbHint').textContent = lb.classList.contains('flipped') ? 'Tap again to turn it back' : 'Tap the cover to flip';
});

lb.addEventListener('click', closeCover);
$('lbClose').addEventListener('click', e => { e.stopPropagation(); closeCover(); });
document.addEventListener('keydown', e => {
  if (!lbOpen) return;
  if (e.key === 'Escape') closeCover();
  if (e.key === 'f' || e.key === 'F') lb.classList.toggle('flipped');
});

if (!reduceMotion) {
  lb.addEventListener('pointermove', e => { if (lbOpen && !busy) tilt(lbTilt, lbGlare, e, 18); });
  lb.addEventListener('pointerleave', () => untilt(lbTilt, lbGlare));
  lb.addEventListener('pointerup', e => { if (e.pointerType === 'touch') untilt(lbTilt, lbGlare); });
}
</script>
</body>
</html>
